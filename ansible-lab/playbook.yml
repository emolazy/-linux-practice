---
- name: Настройка локального сервера
  hosts: local
  become: yes # Выполнять команды от имени root (sudo)

  vars:
    package_to_install: "nginx" # Переменная

  tasks:
    - name: Обновить кэш apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Установить Nginx (используя переменную)
      apt:
        name: "{{ package_to_install }}"
        state: present

    - name: Убедиться, что служба Nginx запущена
      service:
        name: nginx
        state: started
        enabled: yes
