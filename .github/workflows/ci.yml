name: Python CI
name: Capstone API CI

on: [push]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    # Указываем рабочую директорию, где лежит наш проект
    defaults:
      run:
        working-directory: ./capstone-api

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-html
        
    - name: Run tests
      run: |
        pytest app/tests/ -v --html=report.html --self-contained-html
        
    - name: Build Docker Image
      run: |
        docker build -t capstone-api:test .