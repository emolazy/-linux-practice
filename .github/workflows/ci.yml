name: Python CI

# Триггер: запускать при каждом пуше в любую ветку
on: [push]

jobs:
  test-and-run:
    # Запускаем на виртуальной машине GitHub с Ubuntu
    runs-on: ubuntu-latest
    
    steps:
    # 1. Клонируем ваш код на сервер GitHub
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 2. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    # 3. Устанавливаем зависимости
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    # 4. Запускаем наш скрипт (проверка API)
    - name: Run API script
      run: python api_test.py
