name: Capstone API CI/CD

on: [push]

# Даем права на запись пакетов (образов) в GHCR
permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./capstone-api

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-html
        
    - name: Run tests
      run: |
        pytest app/tests/ -v --html=report.html --self-contained-html

    # НОВЫЙ ШАГ: Логин в GitHub Container Registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # НОВЫЙ ШАГ: Сборка и отправка (push) образа
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./capstone-api
        push: true
        # Формируем тег (имя) образа: ghcr.io/ВАШ_НИК/capstone-api:latest
        tags: ghcr.io/${{ github.repository_owner }}/capstone-api:latest