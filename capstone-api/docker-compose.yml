version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: capstone_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .  # Собираем образ из нашего Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db # Запускаем приложение только после запуска БД
    environment:
      # ВАЖНО: Внутри Docker-сети база доступна по имени сервиса (db), а не localhost!
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/capstone_db

volumes:
  pgdata: