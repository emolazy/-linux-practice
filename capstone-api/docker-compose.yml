version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: capstone_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    # Мы убрали ports: "8000:8000", так как теперь доступ идет только через Nginx
    depends_on:
      - db 
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/capstone_db

  # НОВЫЙ СЕРВИС NGINX
  nginx:
    image: nginx:alpine
    ports:
      - "443:443" # Пробрасываем порт HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/server.crt:/etc/nginx/server.crt:ro
      - ./nginx/server.key:/etc/nginx/server.key:ro
    depends_on:
      - app

volumes:
  pgdata: